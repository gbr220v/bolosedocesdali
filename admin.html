<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pedidos · Bolos e Doces da Li</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..800,0..100&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Painel da Li: lista de pedidos recebidos pelo cardápio, com filtro, detalhe, status e exportação. */
:root{
  --bg:#FFF5F2; --surface:#FFFFFF; --surface-2:#FFEDE7; --ink:#3A1E24; --muted:#8E6B72;
  --rose:#D93B74; --rose-ink:#A61E55; --rose-soft:#FBE3EB; --line:#F0D6DB; --ok:#2E8B57; --warn:#B8541A; --warn-bg:#FFF1E6;
  --display:"Fraunces", Georgia, serif; --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1C1216; --surface:#271A20; --surface-2:#34232B; --ink:#FBEFF1; --muted:#CBA9B1; --rose:#FF6FA3; --rose-ink:#FF9AC0; --rose-soft:#3D2230; --line:#46313A; --ok:#5FD08F; --warn:#FFB07A; --warn-bg:#3A2418; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1C1216; --surface:#271A20; --surface-2:#34232B; --ink:#FBEFF1; --muted:#CBA9B1; --rose:#FF6FA3; --rose-ink:#FF9AC0; --rose-soft:#3D2230; --line:#46313A; --ok:#5FD08F; --warn:#FFB07A; --warn-bg:#3A2418; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:env(safe-area-inset-top,0px) 40px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-variation-settings:"SOFT" 100;margin:0;line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800}
.top .sub{font-size:13px;color:var(--muted);font-weight:700}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-ink)}
button,input,select{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:900;font-size:14.5px;background:var(--rose);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font-weight:600;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:26px;font-weight:700;color:var(--rose-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.filters .txt{flex:1 1 200px;width:auto}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ped summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;align-items:center}
.ped summary::-webkit-details-marker{display:none}
.ped .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.ped .l2{font-size:13px;color:var(--muted);font-weight:700}
.ped .price{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:700;color:var(--rose-ink);font-size:20px;font-variant-numeric:tabular-nums;grid-row:1/3;text-align:right;white-space:nowrap}
.ped .det{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.ped table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ped td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.ped td:last-child{text-align:right;white-space:nowrap}
.ped pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--surface);border-radius:12px;padding:10px 12px;margin:0;border:1px solid var(--line)}
.st{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--muted)}
.st.novo{background:var(--rose-soft);color:var(--rose-ink)}
.st.confirmado{color:var(--ok);border:1px solid var(--ok);background:transparent}
.st.entregue{color:var(--muted);border:1px solid var(--line);background:transparent}
.st.cancelado{background:var(--warn-bg);color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts select{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--surface);font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv b{color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;align-self:baseline}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:600}
.msg{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:520px){ .ped .price{font-size:17px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Bolos e Doces da Li</div><h1>Pedidos recebidos</h1><div class="sub" id="who"></div></div>
    <div class="acts"><a class="btn ghost sm" href="./">← Cardápio</a><button type="button" class="btn ghost sm" id="logout" hidden>Sair</button></div>
  </div>

  <div class="card" id="login" hidden>
    <div><div class="eyebrow">Acesso da Li</div><h2 style="font-size:22px;font-weight:700">Entrar no painel</h2></div>
    <p style="margin:0;color:var(--muted)">Digite seu e-mail e abra o link que chegar. Só e-mails marcados como administradores enxergam os pedidos.</p>
    <input class="txt" id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    <button type="button" class="btn" id="send">Receber link de acesso</button>
    <div id="login-msg" hidden></div>
  </div>

  <div id="panel" hidden>
    <div class="stats" id="stats"></div>
    <div class="card" style="margin-top:12px;gap:10px">
      <div class="filters" id="status-filter">
        <button type="button" class="chip" data-st="" aria-pressed="true">Todos</button>
        <button type="button" class="chip" data-st="novo">Novos</button>
        <button type="button" class="chip" data-st="confirmado">Confirmados</button>
        <button type="button" class="chip" data-st="entregue">Entregues</button>
        <button type="button" class="chip" data-st="cancelado">Cancelados</button>
        <input class="txt" id="q" type="search" placeholder="Buscar código, nome ou e-mail">
        <button type="button" class="btn ghost sm" id="csv">Exportar CSV</button>
        <button type="button" class="btn ghost sm" id="reload">Atualizar</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="msg" id="denied" hidden>Esta conta não tem acesso ao painel. Peça pro Gabriel marcar seu e-mail como administrador.</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://busehqnclfxtlqblnhdd.supabase.co';          // mesmo valor do index.html
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1c2VocW5jbGZ4dGxxYmxuaGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3OTg5NzQsImV4cCI6MjEwODM3NDk3NH0.OXiaSRJa9n8opi34SuJCwVm62A6xVK39l9n-7MRy6Y4';
const SITE_URL = location.href.split(/[?#]/)[0];
const brl = n => 'R$' + (+n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const dt = s => s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const dd = s => s ? s.split('-').reverse().join('/') : '—';
let toastT; const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); };
const $ = id => document.getElementById(id);

if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { $('login').hidden = false; $('login').innerHTML = '<div class="msg">Painel ainda não configurado: preencha SUPABASE_URL e SUPABASE_ANON_KEY no admin.html.</div>'; }
const SB = (SUPABASE_URL && SUPABASE_ANON_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let user = null, perfil = null, pedidos = [], filtro = '', busca = '';

if (SB) {
  $('send').addEventListener('click', async () => {
    const email = $('email').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Confira o e-mail'); return; }
    $('send').disabled = true; const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: SITE_URL } }); $('send').disabled = false;
    const m = $('login-msg'); m.hidden = false; m.className = error ? 'msg' : 'card'; m.textContent = error ? 'Não deu pra enviar: ' + error.message : 'Link enviado! Abra o e-mail e toque no link para entrar.';
  });
  $('logout').addEventListener('click', async () => { await SB.auth.signOut(); location.reload(); });
  $('reload').addEventListener('click', load);
  $('q').addEventListener('input', () => { busca = $('q').value.trim().toLowerCase(); render(); });
  document.querySelectorAll('#status-filter .chip').forEach(c => c.addEventListener('click', () => { filtro = c.dataset.st; document.querySelectorAll('#status-filter .chip').forEach(x => x.setAttribute('aria-pressed', String(x === c))); render(); }));
  $('csv').addEventListener('click', exportCsv);

  SB.auth.onAuthStateChange(async (_e, session) => {
    user = session ? session.user : null;
    if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
    if (!user) { $('login').hidden = false; $('panel').hidden = true; $('logout').hidden = true; $('who').textContent = ''; return; }
    const { data } = await SB.from('perfis').select('nome, email, is_admin').eq('id', user.id).maybeSingle(); perfil = data;
    $('logout').hidden = false; $('login').hidden = true; $('who').textContent = (perfil && perfil.nome ? perfil.nome + ' · ' : '') + user.email;
    if (!perfil || !perfil.is_admin) { $('denied').hidden = false; $('panel').hidden = true; return; }
    $('denied').hidden = true; $('panel').hidden = false; load();
  });
}

async function load() {
  const { data, error } = await SB.from('v_pedidos_admin').select('*').order('criado_em', { ascending: false }).limit(500);
  if (error) { toast('Erro ao carregar: ' + error.message); return; }
  pedidos = data || []; render();
}
function render() {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const mes = pedidos.filter(p => new Date(p.criado_em).getMonth() === hoje.getMonth() && new Date(p.criado_em).getFullYear() === hoje.getFullYear());
  const novos = pedidos.filter(p => p.status === 'novo');
  const fat = mes.filter(p => p.status !== 'cancelado').reduce((t, p) => t + +p.total, 0);
  const prox = pedidos.filter(p => p.data_festa && p.status !== 'cancelado' && p.status !== 'entregue' && new Date(p.data_festa + 'T00:00') >= hoje).length;
  $('stats').innerHTML = `<div class="stat"><b>${novos.length}</b><span>novos a confirmar</span></div><div class="stat"><b>${mes.length}</b><span>pedidos no mês</span></div><div class="stat"><b>${brl(fat)}</b><span>total no mês</span></div><div class="stat"><b>${prox}</b><span>festas a entregar</span></div>`;
  const vis = pedidos.filter(p => (!filtro || p.status === filtro) && (!busca || [p.codigo, p.nome_cliente, p.email, p.itens_resumo].join(' ').toLowerCase().includes(busca)));
  const list = $('list'); list.innerHTML = '';
  if (!vis.length) { list.innerHTML = '<div class="empty">Nenhum pedido aqui.</div>'; return; }
  vis.forEach(p => {
    const d = document.createElement('details'); d.className = 'ped'; d.dataset.id = p.id;
    d.innerHTML = `<summary>
        <div class="l1"><span class="st ${esc(p.status)}">${esc(p.status)}</span><span>${esc(p.codigo)}</span><span>${esc(p.nome_cliente || p.email || '')}</span></div>
        <div class="l2">${dt(p.criado_em)} · festa ${dd(p.data_festa)} · ${esc(p.itens_resumo || '')}${p.entrega ? ' · ' + esc(p.entrega) : ''}</div>
        <span class="price">${brl(p.total)}</span>
      </summary><div class="det"><div class="empty">Carregando itens…</div></div>`;
    d.addEventListener('toggle', () => { if (d.open && !d.dataset.loaded) loadDet(p, d.querySelector('.det')); });
    list.appendChild(d);
  });
}
async function loadDet(p, det) {
  const { data: itens, error } = await SB.from('pedido_itens').select('tipo, nome, grupo, qtd, unidade, unitario, total, detalhes').eq('pedido_id', p.id).order('id');
  if (error) { det.innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
  const rows = (itens || []).map(it => {
    let nome = esc(it.nome) + (it.grupo ? ` <span style="color:var(--muted)">· ${esc(it.grupo)}</span>` : '');
    if (it.tipo === 'bolo' && it.detalhes) { const x = it.detalhes; nome += `<br><span style="color:var(--muted)">recheio: ${esc((x.recheios || []).join(' + ') || 'a combinar')} · topper: ${x.topper ? 'sim' : 'não'}${x.tema ? ' · tema: ' + esc(x.tema) : ''}</span>`; }
    const q = it.unidade === 'kg' ? (+it.qtd).toLocaleString('pt-BR', { minimumFractionDigits: 1 }) + ' kg' : Math.round(+it.qtd) + ' un';
    return `<tr><td>${nome}</td><td>${q} × ${brl(it.unitario)}</td><td><b>${brl(it.total)}</b></td></tr>`;
  }).join('');
  det.innerHTML = `
    <div class="kv">
      <b>Cliente</b><span>${esc(p.nome_cliente || '—')} · ${esc(p.email || '')}${p.telefone ? ' · ' + esc(p.telefone) : ''}</span>
      <b>Festa</b><span>${dd(p.data_festa)}</span>
      <b>Entrega</b><span>${p.entrega === 'entrega' ? 'Entrega em ' + esc(p.endereco || 'endereço não informado') : p.entrega === 'retirada' ? 'Retirada' : 'a combinar'}</span>
      ${p.obs ? `<b>Obs</b><span>${esc(p.obs)}</span>` : ''}
    </div>
    <table>${rows}<tr><td colspan="2" style="text-align:right;border:0"><b>Total</b></td><td style="border:0"><b>${brl(p.total)}</b></td></tr></table>
    <div class="acts"><label style="font-weight:800;font-size:13px">Status</label>
      <select data-id="${p.id}">${['novo', 'confirmado', 'entregue', 'cancelado'].map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <button type="button" class="btn ghost sm" data-msg="${p.id}">Ver mensagem do WhatsApp</button>
    </div>
    <pre hidden>${esc(p.mensagem || '')}</pre>`;
  det.parentElement.dataset.loaded = '1';
  det.querySelector('select').addEventListener('change', async e => {
    const status = e.target.value; const { error: er } = await SB.from('pedidos').update({ status }).eq('id', p.id);
    if (er) { toast('Não salvou: ' + er.message); return; }
    p.status = status; toast(`Pedido ${p.codigo}: ${status}`); render(); const again = document.querySelector(`.ped[data-id="${p.id}"]`); if (again) again.open = true;
  });
  det.querySelector('[data-msg]').addEventListener('click', () => { const pre = det.querySelector('pre'); pre.hidden = !pre.hidden; });
}
function exportCsv() {
  const cols = ['codigo', 'criado_em', 'status', 'nome_cliente', 'email', 'telefone', 'data_festa', 'entrega', 'endereco', 'itens_resumo', 'total', 'obs'];
  const line = a => a.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';');
  const csv = '﻿' + [line(cols), ...pedidos.map(p => line(cols.map(c => c === 'total' ? String(p[c]).replace('.', ',') : p[c])))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `pedidos-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}
</script>
</body>
</html>
